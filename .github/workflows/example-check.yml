name: Build and validate public XLSX example

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_environment21.py'
      - 'scripts/build_business13.py'
      - 'scripts/formula_eval.py'
      - 'scripts/check_public_cases.py'
      - 'data/**/instruction*.txt'
      - 'data/**/evaluate.py'
      - 'scripts/validate_annotations.py'
      - 'docs/**'
      - 'schemas/**'
      - 'data/catalog.json'
      - 'data/**/metadata.json'
      - 'requirements.txt'
      - 'data/environment/case_1_realhitbench_environment21/evaluate.py'
      - 'data/business/case_1_realhitbench_business13/evaluate.py'
      - '.github/workflows/example-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Check annotation schema and catalog
        run: python scripts/validate_annotations.py
      - name: Generate Excel input and gold
        run: python scripts/build_environment21.py
      - name: Verify gold result
        run: python data/environment/case_1_realhitbench_environment21/evaluate.py data/environment/case_1_realhitbench_environment21/gold_output.xlsx
      - name: Generate business13 input and gold
        run: python scripts/build_business13.py
      - name: Verify business13 example
        run: python data/business/case_1_realhitbench_business13/evaluate.py data/business/case_1_realhitbench_business13/gold_output.xlsx
      - name: Verify labor example
        run: python data/labor/case_1_realhitbench_labor43/evaluate.py data/labor/case_1_realhitbench_labor43/gold_output.xlsx
      - name: Verify Science58 source, gold and numeric invariants
        run: python data/science/case_1_realhitbench_science58/verify_package.py
      - name: Regression checks for Science58 evaluator
        run: python data/science/case_1_realhitbench_science58/test_case.py
      - name: Regression checks for public case evaluators
        run: python scripts/check_public_cases.py
      - name: Commit generated XLSX artifacts if changed
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/environment/case_1_realhitbench_environment21/input.xlsx data/environment/case_1_realhitbench_environment21/gold_output.xlsx data/environment/case_1_realhitbench_environment21/gold_canonical.json
          git add data/business/case_1_realhitbench_business13/input.xlsx data/business/case_1_realhitbench_business13/gold_output.xlsx data/business/case_1_realhitbench_business13/gold_canonical.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish regenerated RealHiTBench environment21 example"
            git push
          fi
