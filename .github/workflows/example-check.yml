name: Build and validate public XLSX example

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_environment21.py'
      - 'data/environment/realhitbench/environment21/cases/op2_op3_total_statistics/evaluate.py'
      - '.github/workflows/example-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Generate Excel input and gold
        run: python scripts/build_environment21.py
      - name: Verify gold result
        run: python data/environment/realhitbench/environment21/cases/op2_op3_total_statistics/evaluate.py data/environment/realhitbench/environment21/cases/op2_op3_total_statistics/gold_output.xlsx
      - name: Commit generated XLSX artifacts if changed
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/environment/realhitbench/environment21/cases/op2_op3_total_statistics/input.xlsx data/environment/realhitbench/environment21/cases/op2_op3_total_statistics/gold_output.xlsx data/environment/realhitbench/environment21/cases/op2_op3_total_statistics/gold_canonical.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish regenerated RealHiTBench environment21 example"
            git push
          fi
